<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15806e">
<title>Заказы — Вершина</title>
<link rel="icon" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --page:#f4f5f4;--surface:#ffffff;--ink:#22272b;--ink2:#4c5357;--muted:#868d91;
  --line:#e3e6e4;--soft:#eef1ef;
  --brand:#15806e;--brand-dark:#0e5f52;--brand-soft:#e7f2f0;
  --plan:#2a6fd6;--plan-soft:#e8f0fc;
  --done:#1f8a3a;--done-soft:#e6f4ea;
  --cancel:#c23b3b;--cancel-soft:#fbeaea;
  --warn:#a96a00;--warn-soft:#fdf3df;
  --now:#e8590c;--now-soft:#fff0e6;
  --shadow:0 1px 2px rgba(34,39,43,.06),0 8px 24px -12px rgba(34,39,43,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#111415;--surface:#1b1f21;--ink:#f1f3f2;--ink2:#c5cbc8;--muted:#8b9390;
    --line:#2b3134;--soft:#232829;
    --brand:#2fb39c;--brand-dark:#5fd0bb;--brand-soft:#16302b;
    --plan:#6ea2f0;--plan-soft:#18263b;--done:#57c26f;--done-soft:#16291b;
    --cancel:#ec7a7a;--cancel-soft:#341a1a;--warn:#e7b04a;--warn-soft:#33270f;
    --now:#ff8c47;--now-soft:#3a2214;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#111415;--surface:#1b1f21;--ink:#f1f3f2;--ink2:#c5cbc8;--muted:#8b9390;
  --line:#2b3134;--soft:#232829;
  --brand:#2fb39c;--brand-dark:#5fd0bb;--brand-soft:#16302b;
  --plan:#6ea2f0;--plan-soft:#18263b;--done:#57c26f;--done-soft:#16291b;
  --cancel:#ec7a7a;--cancel-soft:#341a1a;--warn:#e7b04a;--warn-soft:#33270f;
  --now:#ff8c47;--now-soft:#3a2214;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.45 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.hidden{display:none!important}

/* ---------- PIN ---------- */
.pin{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px calc(32px + env(safe-area-inset-bottom))}
.pin-brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.22em;font-size:14px;color:var(--brand)}
.pin-brand img{width:34px;height:34px;border-radius:9px}
.pin h1{margin:22px 0 6px;font-size:22px;font-weight:600;text-align:center}
.pin p{margin:0 0 26px;color:var(--muted);font-size:14px;text-align:center}
.dots{display:flex;gap:16px;margin-bottom:10px}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:.15s}
.dots span.on{background:var(--brand);border-color:var(--brand);transform:scale(1.1)}
.dots.err{animation:shake .4s}
.dots.err span{border-color:var(--cancel);background:transparent}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-msg{height:20px;font-size:13px;color:var(--cancel);margin-bottom:14px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:26px;font-weight:500;transition:transform .08s,background .15s;touch-action:manipulation}
.pad button:active{transform:scale(.94);background:var(--brand-soft)}
.pad .ghost{background:transparent;box-shadow:none;font-size:14px;font-weight:600;color:var(--muted)}
.pad .ghost:active{background:var(--soft)}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0 10px;padding-top:calc(12px + env(safe-area-inset-top))}
.bar img{width:30px;height:30px;border-radius:8px}
.bar h1{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0}
.bar h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:1px}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--done);box-shadow:0 0 0 0 var(--done);animation:pulse 2s infinite}
.live.stale i{background:var(--warn);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--done) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip b{font-weight:600;color:var(--muted);margin-left:4px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--page)}
.chip.on b{color:color-mix(in srgb,var(--page) 70%,transparent)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- лента ---------- */
main{padding:6px 0 calc(40px + env(safe-area-inset-bottom))}
.banner{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500}
.day{margin-top:22px}
.day-h{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px}
.day-h h2{margin:0;font-size:15px;font-weight:700}
.day-h h2::first-letter{text-transform:uppercase}
.day-h span{font-size:13px;color:var(--muted);font-weight:500}
.day-h .today{color:var(--brand)}
.card{display:grid;grid-template-columns:62px 1fr;gap:14px;background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px;border:1px solid transparent}
.card.now{border-color:color-mix(in srgb,var(--now) 45%,transparent)}
.card.cancel{opacity:.62}
.card.cancel .svc{text-decoration:line-through;text-decoration-thickness:1.5px}
.time{font-variant-numeric:tabular-nums}
.time b{display:block;font-size:17px;font-weight:700;line-height:1.2}
.time span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.time .loc{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 5px;border-radius:5px}
.time .bar-v{width:3px;border-radius:2px;background:var(--line);margin:8px 0 0 2px;height:calc(100% - 46px);min-height:14px}
.card.now .time .bar-v{background:var(--now)}
.body{min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--soft);color:var(--ink2);letter-spacing:.01em}
.tag.city{background:var(--brand-soft);color:var(--brand-dark)}
.st-plan{background:var(--plan-soft);color:var(--plan)}
.st-done{background:var(--done-soft);color:var(--done)}
.st-cancel{background:var(--cancel-soft);color:var(--cancel)}
.st-open,.st-moved,.st-partial{background:var(--warn-soft);color:var(--warn)}
.st-now{background:var(--now-soft);color:var(--now)}
.svc{margin:0;font-size:16.5px;font-weight:700;line-height:1.3}
.svc em{font-style:normal;color:var(--muted);font-weight:600}
.rows{margin-top:10px;display:grid;gap:7px}
.row{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--ink2);min-width:0}
.row svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--muted)}
.row a{text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--brand) 35%,transparent)}
.row a:hover{color:var(--brand)}
.row .txt{min-width:0;overflow-wrap:anywhere}
.row .ph{white-space:nowrap;display:block;color:var(--muted);font-size:13px;margin-top:1px}
.call svg{color:#fff!important;margin:0!important}
.call{display:inline-flex;align-items:center;gap:6px;margin-left:auto;flex:none;padding:6px 12px;border-radius:999px;background:var(--brand);color:#fff!important;font-size:13px;font-weight:600;text-decoration:none;border:0!important}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.items span{font-size:12.5px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);color:var(--ink2)}
.notes{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:13.5px;color:var(--ink);white-space:pre-line;overflow-wrap:anywhere}
.notes::before{content:"Пометки";display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.ctitle{margin-top:3px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.money{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.money div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.money span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.money b{display:block;font-size:15px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.money small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.money .main{background:var(--brand-soft);border-color:transparent}
.money .main b{color:var(--brand-dark)}
.money .pos b{color:var(--done)}
.money .neg b{color:var(--cancel)}
.items.priced{display:grid;gap:4px}
.items.priced span{border:0;padding:0;font-size:13px}
.items.priced span::before{content:"• ";color:var(--muted)}
.day-h .sum{margin-left:auto;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
.foot button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12px;padding:6px}
.skeleton{height:150px;border-radius:16px;background:linear-gradient(90deg,var(--surface),var(--soft),var(--surface));background-size:200% 100%;animation:sk 1.2s infinite;margin-top:22px}
@keyframes sk{to{background-position:-200% 0}}
.row .txt{flex:1}
@media (max-width:520px){.call{width:40px;height:40px;padding:0;justify-content:center;border-radius:50%}.call span{display:none}.call svg{width:17px;height:17px}}
@media (max-width:380px){.card{grid-template-columns:52px 1fr;gap:11px;padding:14px}.pad{grid-template-columns:repeat(3,70px)}.pad button{height:70px}}
</style>
</head>
<body>

<section class="pin" id="pinView">
  <div class="pin-brand"><img src="/apple-touch-icon.png" alt="">ВЕРШИНА</div>
  <h1>Заказы в работе</h1>
  <p>Введите PIN-код сотрудника</p>
  <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
  <div class="pin-msg" id="pinMsg"></div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <span></span><button data-k="0">0</button><button class="ghost" data-k="del" aria-label="Стереть">Стереть</button>
  </div>
</section>

<section id="appView" class="hidden">
  <header class="top">
    <div class="wrap">
      <div class="bar">
        <img src="/apple-touch-icon.png" alt="">
        <h1>Заказы<small class="live" id="live"><i></i><span id="liveText">загрузка…</span></small></h1>
        <button class="icon-btn" id="refresh" aria-label="Обновить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
      <div class="seg" id="seg">
        <button data-v="upcoming" class="on">Предстоящие</button>
        <button data-v="past">Прошедшие</button>
      </div>
      <div class="filters" id="cities"></div>
    </div>
  </header>
  <main class="wrap">
    <div id="banner" class="banner hidden"></div>
    <div id="list"><div class="skeleton"></div><div class="skeleton"></div></div>
    <div class="foot">Время московское, для Нового Уренгоя и Салехарда — местное. Обновляется само каждые 30 секунд.<br><button id="logout">Выйти</button></div>
  </main>
</section>

<script>
(() => {
  const API = "https://apuajxotemukpjheppaz.supabase.co/functions/v1/staff-calendar";
  const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwdWFqeG90ZW11a3BqaGVwcGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1ODYxNDAsImV4cCI6MjEwMTE2MjE0MH0.JJut-Uo9kuCmjnMBW7hp-am4W-iiE6SxDcEK59j-5s8";
  const TZ = "Europe/Moscow";
  const POLL_MS = 30000;
  const KEY = "vershina-staff-pin";

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let pin = "";
  let savedPin = store.get(KEY);
  let orders = [];
  let lastOk = 0;
  let view = store.get("vershina-staff-view") || "upcoming";
  let city = store.get("vershina-staff-city") || "all";
  let timer = null;
  let tick = null;
  let busy = false;

  // ---------- PIN ----------
  function paintDots(err) {
    const d = $("dots");
    d.classList.toggle("err", !!err);
    [...d.children].forEach((s, i) => s.classList.toggle("on", !err && i < pin.length));
  }
  $("pad").addEventListener("click", (e) => {
    const k = e.target.closest("button")?.dataset.k;
    if (!k || busy) return;
    press(k);
  });
  document.addEventListener("keydown", (e) => {
    if ($("pinView").classList.contains("hidden") || busy) return;
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("del");
  });
  function press(k) {
    $("pinMsg").textContent = "";
    if (k === "del") pin = pin.slice(0, -1);
    else if (pin.length < 4) pin += k;
    paintDots();
    if (pin.length === 4) tryPin(pin);
  }
  async function tryPin(p) {
    busy = true;
    const r = await load(p).catch((e) => ({ ok: false, status: 0, error: e.message }));
    busy = false;
    if (r.ok) {
      savedPin = p;
      store.set(KEY, p);
      showApp();
      apply(r.data);
    } else {
      pin = "";
      paintDots(true);
      $("pinMsg").textContent = r.status === 401 ? "Неверный PIN" : (r.error || "Нет связи, попробуйте ещё раз");
      setTimeout(() => paintDots(), 600);
    }
  }

  // ---------- данные ----------
  async function load(p) {
    const res = await fetch(API, {
      method: "POST",
      headers: { "content-type": "application/json", apikey: ANON, authorization: `Bearer ${ANON}` },
      body: JSON.stringify({ pin: p }),
      cache: "no-store",
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok && data.ok, status: res.status, error: data.error, data };
  }
  async function refresh(manual) {
    if (!savedPin) return;
    const btn = $("refresh");
    if (manual) btn.classList.add("spin");
    try {
      const r = await load(savedPin);
      if (r.ok) { apply(r.data); hideBanner(); }
      else if (r.status === 401) { logout("PIN изменился — введите новый"); }
      else showBanner(r.error || "Не удалось обновить. Показаны последние данные.");
    } catch {
      showBanner("Нет связи. Показаны последние загруженные данные.");
    } finally {
      btn.classList.remove("spin");
      paintLive();
    }
  }
  function apply(data) {
    orders = (data.orders || []).slice().sort((a, b) => (a.start || "").localeCompare(b.start || ""));
    lastOk = Date.now();
    render();
    paintLive();
  }
  function showBanner(t) { const b = $("banner"); b.textContent = t; b.classList.remove("hidden"); }
  function hideBanner() { $("banner").classList.add("hidden"); }
  function paintLive() {
    const stale = !lastOk || Date.now() - lastOk > POLL_MS * 3;
    $("live").classList.toggle("stale", stale);
    $("liveText").textContent = lastOk ? `обновлено в ${fmtTime(new Date(lastOk))}` : "загрузка…";
  }

  // ---------- форматирование ----------
  const fTime = new Intl.DateTimeFormat("ru-RU", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
  // Города не по Москве: время заказа показываем по местному, чтобы бригада не опоздала
  const CITY_TZ = { "Новый Уренгой": "Asia/Yekaterinburg", "Салехард": "Asia/Yekaterinburg" };
  const fLocal = {};
  const localTime = (d, city) => {
    const tz = CITY_TZ[city];
    if (!tz) return fTime.format(d);
    fLocal[tz] = fLocal[tz] || new Intl.DateTimeFormat("ru-RU", { timeZone: tz, hour: "2-digit", minute: "2-digit" });
    return fLocal[tz].format(d);
  };
  const fDayKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  const fDay = new Intl.DateTimeFormat("ru-RU", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });
  const fmtTime = (d) => fTime.format(d);
  const dayKey = (d) => fDayKey.format(d);
  function dayTitle(key) {
    const today = dayKey(new Date());
    const tomorrow = dayKey(new Date(Date.now() + 86400000));
    const yesterday = dayKey(new Date(Date.now() - 86400000));
    const label = fDay.format(new Date(key + "T12:00:00+03:00"));
    if (key === today) return { main: "Сегодня", sub: label, today: true };
    if (key === tomorrow) return { main: "Завтра", sub: label };
    if (key === yesterday) return { main: "Вчера", sub: label };
    return { main: label, sub: "" };
  }
  const STATUS = {
    plan: ["Запланирован", "st-plan"], open: ["Без отметки", "st-open"], done: ["Выполнен", "st-done"],
    cancel: ["Отменён", "st-cancel"], partial: ["Частично", "st-partial"], moved: ["Перенос", "st-moved"],
  };
  const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + " ₽";
  const prettyPhone = (p) => {
    const d = p.replace(/\D/g, "");
    const m = /^[78]?(\d{3})(\d{3})(\d{2})(\d{2})$/.exec(d);
    return m ? `+7 ${m[1]} ${m[2]}-${m[3]}-${m[4]}` : p;
  };
  const ICON = {
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    phone: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>',
  };

  // ---------- отрисовка ----------
  function visible() {
    const startOfToday = new Date(dayKey(new Date()) + "T00:00:00+03:00").getTime();
    return orders.filter((o) => {
      const s = o.start ? new Date(o.start).getTime() : 0;
      // «Предстоящие» — всё с сегодняшнего дня (включая уже выполненные сегодня); «Прошедшие» — раньше
      const upcoming = s >= startOfToday;
      return view === "upcoming" ? upcoming : !upcoming;
    });
  }
  function renderCities(list) {
    const counts = {};
    for (const o of list) counts[o.city || "Без города"] = (counts[o.city || "Без города"] || 0) + 1;
    const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b, "ru"));
    if (city !== "all" && !counts[city]) city = "all";
    const chip = (key, label, n) => `<button class="chip${city === key ? " on" : ""}" data-c="${esc(key)}">${esc(label)}<b>${n}</b></button>`;
    $("cities").innerHTML = chip("all", "Все города", list.length) + names.map((n) => chip(n, n, counts[n])).join("");
  }
  function card(o) {
    const now = Date.now();
    const s = o.start ? new Date(o.start) : null;
    const e = o.end ? new Date(o.end) : null;
    const isNow = s && e && s.getTime() <= now && now < e.getTime() && o.status !== "cancel";
    const st = STATUS[o.status] || null;
    const title = esc(o.service || "Заказ") + (o.area ? ` <em>· ${esc(String(o.area).replace(".", ","))} м²</em>` : "");
    const addr = [o.address, o.entrance ? `подъезд ${o.entrance}` : ""].filter(Boolean).join(", ");
    const mapQ = encodeURIComponent([o.city, o.address].filter(Boolean).join(", "));
    const rows = [];
    if (o.address) rows.push(`<div class="row">${ICON.pin}<span class="txt"><a href="https://yandex.ru/maps/?text=${mapQ}" target="_blank" rel="noopener">${esc(addr)}</a></span></div>`);
    if (o.client || o.phone) rows.push(`<div class="row">${ICON.user}<span class="txt">${esc(o.client || "Клиент")}${o.phone ? `<span class="ph">${esc(prettyPhone(o.phone))}</span>` : ""}</span>${o.phone ? `<a class="call" href="tel:${esc(o.phone)}" aria-label="Позвонить">${ICON.phone}<span>Позвонить</span></a>` : ""}</div>`);
    if (o.duration) rows.push(`<div class="row">${ICON.clock}<span class="txt">${esc(o.duration)}</span></div>`);
    const items = o.money ? (o.items || []) : (o.items || []).filter((it, i) => !(i === 0 && o.service && it.toLowerCase().startsWith(o.service.toLowerCase())));
    const m = o.money;
    const cell = (label, val, cls = "", sub = "") => val == null ? "" : `<div class="${cls}"><span>${label}</span><b>${money(val)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div>`;
    const moneyHtml = m ? `<div class="money">
        ${cell(m.corrected ? "Оплатил" : "Клиенту", m.client, "main", m.discount || "")}
        ${m.list != null && m.list !== m.client ? cell("По прайсу", m.list) : ""}
        ${cell("Расходы", m.expenses)}
        ${cell("Прибыль", m.profit, m.profit < 0 ? "neg" : "pos")}
      </div>` : "";
    const showTitle = o.title && o.title.trim().toLowerCase() !== [o.service, o.area ? o.area + " м²" : ""].filter(Boolean).join(", ").toLowerCase();
    return `<article class="card${isNow ? " now" : ""}${o.status === "cancel" ? " cancel" : ""}">
      <div class="time">
        ${o.allDay ? "<b>Весь</b><span>день</span>" : `<b>${s ? localTime(s, o.city) : "—"}</b><span>${e ? "до " + localTime(e, o.city) : ""}</span>${CITY_TZ[o.city] ? '<span class="loc">местное</span>' : ""}`}
        <div class="bar-v"></div>
      </div>
      <div class="body">
        <div class="tags">
          ${o.city ? `<span class="tag city">${esc(o.city)}</span>` : ""}
          ${isNow ? '<span class="tag st-now">Идёт сейчас</span>' : st ? `<span class="tag ${st[1]}">${st[0]}</span>` : ""}
        </div>
        <h3 class="svc">${title}</h3>
        ${showTitle ? `<div class="ctitle">${esc(o.title)}</div>` : ""}
        ${rows.length ? `<div class="rows">${rows.join("")}</div>` : ""}
        ${items.length ? `<div class="items${o.money ? " priced" : ""}">${items.map((i) => `<span>${esc(i).replace(/(\d) (?=\d)/g, "$1&nbsp;").replace(/ ₽/g, "&nbsp;₽")}</span>`).join("")}</div>` : ""}
        ${o.notes ? `<div class="notes">${esc(o.notes)}</div>` : ""}
        ${moneyHtml}
      </div>
    </article>`;
  }
  function render() {
    const base = visible();
    renderCities(base);
    let list = city === "all" ? base : base.filter((o) => (o.city || "Без города") === city);
    if (view === "past") list = list.slice().reverse();
    if (!list.length) {
      $("list").innerHTML = `<div class="empty"><b>${view === "upcoming" ? "Заказов пока нет" : "Прошедших заказов нет"}</b>${view === "upcoming" ? "Как только заказ появится в календаре, он будет здесь." : "Показываются последние 14 дней."}</div>`;
      return;
    }
    const groups = new Map();
    for (const o of list) {
      const k = o.start ? dayKey(new Date(o.start)) : "—";
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(o);
    }
    let html = "";
    for (const [k, arr] of groups) {
      const t = dayTitle(k);
      const active = arr.filter((o) => o.status !== "cancel").length;
      const daySum = arr.filter((o) => o.status !== "cancel" && o.money && o.money.client != null).reduce((a, o) => a + o.money.client, 0);
      html += `<section class="day"><div class="day-h"><h2 class="${t.today ? "today" : ""}">${esc(t.main)}</h2><span>${esc(t.sub)}${t.sub ? " · " : ""}${active} ${plural(active, "заказ", "заказа", "заказов")}</span>${daySum ? `<span class="sum">${money(daySum)}</span>` : ""}</div>${arr.map(card).join("")}</section>`;
    }
    $("list").innerHTML = html;
  }
  const plural = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? b : c);

  // ---------- управление ----------
  $("cities").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.c;
    if (!c) return;
    city = c; store.set("vershina-staff-city", c); render();
  });
  $("seg").addEventListener("click", (e) => {
    const v = e.target.closest("button")?.dataset.v;
    if (!v) return;
    view = v; store.set("vershina-staff-view", v);
    [...$("seg").children].forEach((b) => b.classList.toggle("on", b.dataset.v === v));
    render(); scrollTo({ top: 0 });
  });
  $("refresh").addEventListener("click", () => refresh(true));
  $("logout").addEventListener("click", () => logout());
  document.addEventListener("visibilitychange", () => { if (!document.hidden && savedPin) refresh(); });
  window.addEventListener("online", () => refresh());

  function showApp() {
    $("pinView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    [...$("seg").children].forEach((b) => b.classList.toggle("on", b.dataset.v === view));
    clearInterval(timer);
    timer = setInterval(() => { if (!document.hidden) refresh(); else paintLive(); }, POLL_MS);
    if (!tick) tick = setInterval(() => { paintLive(); if (orders.length) render(); }, 60000); // «идёт сейчас» и «сегодня» без запроса
  }
  function logout(msg) {
    savedPin = null; store.del(KEY); clearInterval(timer); orders = []; pin = "";
    $("appView").classList.add("hidden"); $("pinView").classList.remove("hidden");
    $("list").innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    paintDots(); $("pinMsg").textContent = msg || "";
  }

  if (savedPin) { showApp(); refresh(); }
})();
</script>
</body>
</html>
