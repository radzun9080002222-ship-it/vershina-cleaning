<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15806e">
<title>Заказы — Вершина</title>
<link rel="icon" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --page:#f4f5f4;--surface:#ffffff;--ink:#22272b;--ink2:#4c5357;--muted:#868d91;
  --line:#e3e6e4;--soft:#eef1ef;
  --brand:#15806e;--brand-dark:#0e5f52;--brand-soft:#e7f2f0;
  --plan:#2a6fd6;--plan-soft:#e8f0fc;
  --done:#1f8a3a;--done-soft:#e6f4ea;
  --cancel:#c23b3b;--cancel-soft:#fbeaea;
  --warn:#a96a00;--warn-soft:#fdf3df;
  --now:#e8590c;--now-soft:#fff0e6;
  --shadow:0 1px 2px rgba(34,39,43,.06),0 8px 24px -12px rgba(34,39,43,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#111415;--surface:#1b1f21;--ink:#f1f3f2;--ink2:#c5cbc8;--muted:#8b9390;
    --line:#2b3134;--soft:#232829;
    --brand:#2fb39c;--brand-dark:#5fd0bb;--brand-soft:#16302b;
    --plan:#6ea2f0;--plan-soft:#18263b;--done:#57c26f;--done-soft:#16291b;
    --cancel:#ec7a7a;--cancel-soft:#341a1a;--warn:#e7b04a;--warn-soft:#33270f;
    --now:#ff8c47;--now-soft:#3a2214;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#111415;--surface:#1b1f21;--ink:#f1f3f2;--ink2:#c5cbc8;--muted:#8b9390;
  --line:#2b3134;--soft:#232829;
  --brand:#2fb39c;--brand-dark:#5fd0bb;--brand-soft:#16302b;
  --plan:#6ea2f0;--plan-soft:#18263b;--done:#57c26f;--done-soft:#16291b;
  --cancel:#ec7a7a;--cancel-soft:#341a1a;--warn:#e7b04a;--warn-soft:#33270f;
  --now:#ff8c47;--now-soft:#3a2214;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.45 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.hidden{display:none!important}

/* ---------- PIN ---------- */
.pin{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px calc(32px + env(safe-area-inset-bottom))}
.pin-brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.22em;font-size:14px;color:var(--brand)}
.pin-brand img{width:34px;height:34px;border-radius:9px}
.pin h1{margin:22px 0 6px;font-size:22px;font-weight:600;text-align:center}
.pin p{margin:0 0 26px;color:var(--muted);font-size:14px;text-align:center}
.dots{display:flex;gap:16px;margin-bottom:10px}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:.15s}
.dots span.on{background:var(--brand);border-color:var(--brand);transform:scale(1.1)}
.dots.err{animation:shake .4s}
.dots.err span{border-color:var(--cancel);background:transparent}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-msg{height:20px;font-size:13px;color:var(--cancel);margin-bottom:14px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:26px;font-weight:500;transition:transform .08s,background .15s;touch-action:manipulation}
.pad button:active{transform:scale(.94);background:var(--brand-soft)}
.pad .ghost{background:transparent;box-shadow:none;font-size:14px;font-weight:600;color:var(--muted)}
.pad .ghost:active{background:var(--soft)}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0 10px;padding-top:calc(12px + env(safe-area-inset-top))}
.bar img{width:30px;height:30px;border-radius:8px}
.bar h1{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0}
.bar h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:1px}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--done);box-shadow:0 0 0 0 var(--done);animation:pulse 2s infinite}
.live.stale i{background:var(--warn);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--done) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 12px}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip b{font-weight:600;color:var(--muted);margin-left:4px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--page)}
.chip.on b{color:color-mix(in srgb,var(--page) 70%,transparent)}

/* ---------- лента ---------- */
main{padding:6px 0 calc(40px + env(safe-area-inset-bottom))}
.banner{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500}
.day{margin-top:22px}
.day-h{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px}
.day-h h2{margin:0;font-size:15px;font-weight:700}
.day-h h2::first-letter{text-transform:uppercase}
.day-h span{font-size:13px;color:var(--muted);font-weight:500}
.day-h .today{color:var(--brand)}
.card{display:grid;grid-template-columns:62px 1fr;gap:14px;background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px;border:1px solid transparent}
.card.now{border-color:color-mix(in srgb,var(--now) 45%,transparent)}
.card.cancel{opacity:.62}
.card.cancel .svc{text-decoration:line-through;text-decoration-thickness:1.5px}
.time{font-variant-numeric:tabular-nums}
.time b{display:block;font-size:17px;font-weight:700;line-height:1.2}
.time span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.time .loc{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 5px;border-radius:5px}
.time .bar-v{width:3px;border-radius:2px;background:var(--line);margin:8px 0 0 2px;height:calc(100% - 46px);min-height:14px}
.card.now .time .bar-v{background:var(--now)}
.body{min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--soft);color:var(--ink2);letter-spacing:.01em}
.tag.city{background:var(--brand-soft);color:var(--brand-dark)}
.st-plan{background:var(--plan-soft);color:var(--plan)}
.st-done{background:var(--done-soft);color:var(--done)}
.st-cancel{background:var(--cancel-soft);color:var(--cancel)}
.st-open,.st-moved,.st-partial{background:var(--warn-soft);color:var(--warn)}
.st-now{background:var(--now-soft);color:var(--now)}
.svc{margin:0;font-size:16.5px;font-weight:700;line-height:1.3}
.svc em{font-style:normal;color:var(--muted);font-weight:600}
.rows{margin-top:10px;display:grid;gap:7px}
.row{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--ink2);min-width:0}
.row svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--muted)}
.row a{text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--brand) 35%,transparent)}
.row a:hover{color:var(--brand)}
.row .txt{min-width:0;overflow-wrap:anywhere}
.row .ph{white-space:nowrap;display:block;color:var(--muted);font-size:13px;margin-top:1px}
.call svg{color:#fff!important;margin:0!important}
.call{display:inline-flex;align-items:center;gap:6px;margin-left:auto;flex:none;padding:6px 12px;border-radius:999px;background:var(--brand);color:#fff!important;font-size:13px;font-weight:600;text-decoration:none;border:0!important}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.items span{font-size:12.5px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);color:var(--ink2)}
.notes{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:13.5px;color:var(--ink);white-space:pre-line;overflow-wrap:anywhere}
.notes::before{content:"Пометки";display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.ctitle{margin-top:3px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.money{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.money div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.money span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.money b{display:block;font-size:15px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.money small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.money .main{background:var(--brand-soft);border-color:transparent}
.money .main b{color:var(--brand-dark)}
.money .pos b{color:var(--done)}
.money .neg b{color:var(--cancel)}
.items.priced{display:grid;gap:4px}
.items.priced span{border:0;padding:0;font-size:13px}
.items.priced span::before{content:"• ";color:var(--muted)}
.day-h .sum{margin-left:auto;white-space:nowrap;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.summary{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin:14px 2px 0;font-size:13px;color:var(--muted)}
.summary b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.summary .pos b{color:var(--done)}
.divider{display:flex;align-items:center;gap:10px;margin:30px 2px 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
.foot button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12px;padding:6px}
.skeleton{height:150px;border-radius:16px;background:linear-gradient(90deg,var(--surface),var(--soft),var(--surface));background-size:200% 100%;animation:sk 1.2s infinite;margin-top:22px}
@keyframes sk{to{background-position:-200% 0}}
.row .txt{flex:1}
@media (max-width:520px){.call{width:40px;height:40px;padding:0;justify-content:center;border-radius:50%}.call span{display:none}.call svg{width:17px;height:17px}}
@media (max-width:380px){.card{grid-template-columns:52px 1fr;gap:11px;padding:14px}.pad{grid-template-columns:repeat(3,70px)}.pad button{height:70px}}
/* ---------- полный календарь (как Google Календарь на телефоне) ---------- */
.cal-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;flex:none}
.cal-btn svg{width:17px;height:17px}
.cal{position:fixed;inset:0;z-index:20;background:var(--surface);display:flex;flex-direction:column}
.cal-top{display:flex;align-items:center;gap:6px;padding:8px 10px 6px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.cal-top h2{margin:0 0 0 2px;font-size:20px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ic{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.cal-ic:active{background:var(--soft)}
.cal-ic svg{width:22px;height:22px}
.cal-today{position:relative}
.cal-today b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:4px;font-size:10px;font-weight:700}
.cal-views{display:flex;gap:4px;padding:6px 10px 8px;border-bottom:1px solid var(--line)}
.cal-views button{flex:1;border:0;background:var(--soft);border-radius:9px;padding:7px 4px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.cal-views button.on{background:var(--ink);color:var(--surface)}
.cal-heads{display:grid;border-bottom:1px solid var(--line);flex:none}
.cal-head{text-align:center;padding:6px 0 7px;cursor:pointer;min-width:0}
.cal-head span{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:lowercase}
.cal-head b{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;margin-top:2px;border-radius:50%;font-size:18px;font-weight:500}
.cal-head.today span{color:var(--plan)}
.cal-head.today b{background:var(--plan);color:#fff}
.cal-allday{display:grid;border-bottom:1px solid var(--line);flex:none}
.cal-allday .cal-cell{padding:2px;display:grid;gap:2px;min-width:0}
.cal-scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.cal-grid{display:grid;position:relative}
.cal-hours{position:relative}
.cal-hours span{position:absolute;right:6px;font-size:10.5px;color:var(--muted);transform:translateY(-50%);white-space:nowrap}
.cal-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.cal-ev{position:absolute;border-radius:6px;padding:3px 5px;overflow:hidden;color:#fff;font-size:11px;line-height:1.25;cursor:pointer;border:1px solid var(--surface);box-sizing:border-box;text-align:left}
.cal-ev b{display:block;font-weight:600;font-size:11.5px;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.cal-ev i{font-style:normal;display:block;opacity:.92;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.cal-ev.cancel{opacity:.55}
.cal-ev.cancel b{text-decoration:line-through}
.cal-ev.dark{color:#202124}
.cal-now{position:absolute;left:0;right:0;height:2px;background:#ea4335;z-index:3;pointer-events:none}
.cal-now::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:#ea4335}
.cal-chip{display:block;border-radius:4px;padding:1px 4px;font-size:10.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-chip.dark{color:#202124}
.cal-chip.cancel{opacity:.55;text-decoration:line-through}
.cal-month{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;overflow:hidden}
.cal-mhead{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);flex:none}
.cal-mhead span{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.cal-day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 2px;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.cal-day:nth-child(7n){border-right:0}
.cal-day .n{align-self:center;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:500;flex:none}
.cal-day.other .n{color:var(--muted)}
.cal-day.today .n{background:var(--plan);color:#fff}
.cal-day .more{font-size:10px;font-weight:600;color:var(--muted);padding-left:3px}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.38);animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88vh;overflow-y:auto;background:var(--page);border-radius:18px 18px 0 0;padding:8px 12px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out;max-width:780px;margin:0 auto}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 10px}
.sheet .card{margin-bottom:0}
.sheet-close{display:block;width:100%;margin-top:10px;border:0;background:var(--surface);border-radius:12px;padding:12px;font-weight:600;box-shadow:var(--shadow)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
</style>
</head>
<body>

<section class="pin" id="pinView">
  <div class="pin-brand"><img src="/apple-touch-icon.png" alt="">ВЕРШИНА</div>
  <h1>Заказы в работе</h1>
  <p>Введите PIN-код сотрудника</p>
  <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
  <div class="pin-msg" id="pinMsg"></div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <span></span><button data-k="0">0</button><button class="ghost" data-k="del" aria-label="Стереть">Стереть</button>
  </div>
</section>

<section id="appView" class="hidden">
  <header class="top">
    <div class="wrap">
      <div class="bar">
        <img src="/apple-touch-icon.png" alt="">
        <h1>Заказы<small class="live" id="live"><i></i><span id="liveText">загрузка…</span></small></h1>
        <button class="cal-btn" id="openCal" aria-label="Открыть полный календарь"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9h17M8 3v3M16 3v3"/></svg>Календарь</button>
        <button class="icon-btn" id="refresh" aria-label="Обновить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
      <div class="filters" id="periods"></div>
    </div>
  </header>
  <main class="wrap">
    <div id="banner" class="banner hidden"></div>
    <div id="summary" class="summary hidden"></div>
    <div id="list"><div class="skeleton"></div><div class="skeleton"></div></div>
    <div class="foot">Время московское, для Нового Уренгоя и Салехарда — местное. Обновляется само каждые 30 секунд.<br><button id="logout">Выйти</button></div>
  </main>
</section>

<section class="cal hidden" id="calView" aria-label="Календарь">
  <div class="cal-top">
    <button class="cal-ic" id="calBack" aria-label="Назад к списку"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h2 id="calTitle">Календарь</h2>
    <button class="cal-ic" id="calPrev" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="cal-ic" id="calNext" aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="cal-ic cal-today" id="calToday" aria-label="Сегодня"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9h17M8 3v3M16 3v3"/></svg><b id="calTodayNum"></b></button>

<script>
(() => {
  const API = "https://apuajxotemukpjheppaz.supabase.co/functions/v1/staff-calendar";
  const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwdWFqeG90ZW11a3BqaGVwcGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1ODYxNDAsImV4cCI6MjEwMTE2MjE0MH0.JJut-Uo9kuCmjnMBW7hp-am4W-iiE6SxDcEK59j-5s8";
  const TZ = "Europe/Moscow";
  const POLL_MS = 30000;
  const KEY = "vershina-staff-pin";

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let pin = "";
  let savedPin = store.get(KEY);
  let orders = [];
  let lastOk = 0;
  let period = store.get("vershina-staff-period") || "today";
  let timer = null;
  let tick = null;
  let busy = false;

  // ---------- PIN ----------
  function paintDots(err) {
    const d = $("dots");

  $("pad").addEventListener("click", (e) => {

    if ($("pinView").classList.contains("hidden") || busy) return;

  });
  function press(k) {
    $("pinMsg").textContent = "";
    if (k === "del") pin = pin.slice(0, -1);
    else if (pin.length < 4) pin += k;
    paintDots();
    if (pin.length === 4) tryPin(pin);
  }
  async function tryPin(p) {
    busy = true;
    const r = await load(p).catch((e) => ({ ok: false, status: 0, error: e.message }));
    busy = false;
    if (r.ok) {
      savedPin = p;
      store.set(KEY, p);
      showApp();
      apply(r.data);
    } else {
      pin = "";
      paintDots(true);
      $("pinMsg").textContent = r.status === 401 ? "Неверный PIN" : (r.error || "Нет связи, попробуйте ещё раз");

  }

  // ---------- данные ----------
  async function load(p) {
    const res = await fetch(API, {
      method: "POST",
      headers: { "content-type": "application/json", apikey: ANON, authorization: `Bearer ${ANON}` },
      body: JSON.stringify({ pin: p }),
      cache: "no-store",
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok && data.ok, status: res.status, error: data.error, data };
  }
  async function refresh(manual) {
    if (!savedPin) return;
    const btn = $("refresh");
    if (manual) btn.classList.add("spin");
    try {
      const r = await load(savedPin);
      if (r.ok) { apply(r.data); hideBanner(); }
      else if (r.status === 401) { logout("PIN изменился — введите новый"); }
      else showBanner(r.error || "Не удалось обновить. Показаны последние данные.");

      btn.classList.remove("spin");
      paintLive();

  }
  function apply(data) {
    orders = (data.orders || []).slice().sort((a, b) => (a.start || "").localeCompare(b.start || ""));
    lastOk = Date.now();
    render();
    if (typeof renderCal === "function") renderCal();
    paintLive();
  }
  function showBanner(t) { const b = $("banner"); b.textContent = t; b.classList.remove("hidden"); }
  function hideBanner() { $("banner").classList.add("hidden"); }
  function paintLive() {
    const stale = !lastOk || Date.now() - lastOk > POLL_MS * 3;
    $("live").classList.toggle("stale", stale);
    $("liveText").textContent = lastOk ? `обновлено в ${fmtTime(new Date(lastOk))}` : "загрузка…";
  }

  // ---------- форматирование ----------
  const fTime = new Intl.DateTimeFormat("ru-RU", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
  // Города не по Москве: время заказа показываем по местному, чтобы бригада не опоздала
  const CITY_TZ = { "Новый Уренгой": "Asia/Yekaterinburg", "Салехард": "Asia/Yekaterinburg" };
  const fLocal = {};
  const localTime = (d, city) => {
    const tz = CITY_TZ[city];
    if (!tz) return fTime.format(d);
    fLocal[tz] = fLocal[tz] || new Intl.DateTimeFormat("ru-RU", { timeZone: tz, hour: "2-digit", minute: "2-digit" });
    return fLocal[tz].format(d);
  };
  const fDayKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  const fDay = new Intl.DateTimeFormat("ru-RU", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });
  const fmtTime = (d) => fTime.format(d);
  const dayKey = (d) => fDayKey.format(d);
  function dayTitle(key) {
    const today = dayKey(new Date());
    const tomorrow = dayKey(new Date(Date.now() + 86400000));
    const yesterday = dayKey(new Date(Date.now() - 86400000));
    const label = fDay.format(new Date(key + "T12:00:00+03:00"));
    if (key === today) return { main: "Сегодня", sub: label, today: true };
    if (key === tomorrow) return { main: "Завтра", sub: label };
    if (key === yesterday) return { main: "Вчера", sub: label };
    return { main: label, sub: "" };
  }
  const STATUS = {
    plan: ["Запланирован", "st-plan"], open: ["Без отметки", "st-open"], done: ["Выполнен", "st-done"],
    cancel: ["Отменён", "st-cancel"], partial: ["Частично", "st-partial"], moved: ["Перенос", "st-moved"],
  };
  const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + " ₽";
  const prettyPhone = (p) => {
    const d = p.replace(/\D/g, "");
    const m = /^[78]?(\d{3})(\d{3})(\d{2})(\d{2})$/.exec(d);
    return m ? `+7 ${m[1]} ${m[2]}-${m[3]}-${m[4]}` : p;
  };
  const ICON = {
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    phone: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>',
  };

  // ---------- отрисовка ----------
  const PERIODS = [
    ["today", "Сегодня"], ["tomorrow", "Завтра"], ["after", "Послезавтра"],
    ["week", "Ближайшие 7 дней"], ["month", "Этот месяц"], ["all", "Все заказы"],
  ];
  const keyOf = (o) => (o.start ? dayKey(new Date(o.start)) : "");
  const dayAt = (n) => dayKey(new Date(Date.now() + n * 86400000));
  function inPeriod(o, p) {
    const k = keyOf(o);
    switch (p) {
      case "today": return k === dayAt(0);
      case "tomorrow": return k === dayAt(1);
      case "after": return k === dayAt(2);
      case "week": return k >= dayAt(0) && k < dayAt(7);
      case "month": return k.slice(0, 7) === dayAt(0).slice(0, 7);
      default: return true;
    }
  }
  const countActive = (arr) => arr.filter((o) => o.status !== "cancel").length;
  function renderPeriods() {
    if (!PERIODS.some(([k]) => k === period)) period = "today";

    }).join("");
  }
  function renderSummary(list) {
    const act = list.filter((o) => o.status !== "cancel");
    const sum = (f) => act.reduce((a, o) => a + (o.money && o.money[f] != null ? o.money[f] : 0), 0);
    const el = $("summary");
    if (!act.length) { el.classList.add("hidden"); return; }
    const hasMoney = act.some((o) => o.money);
    el.innerHTML = `<span><b>${act.length}</b> ${plural(act.length, "заказ", "заказа", "заказов")}</span>` +
      (hasMoney ? `<span>клиентам <b>${money(sum("client"))}</b></span><span>расходы <b>${money(sum("expenses"))}</b></span><span class="pos">прибыль <b>${money(sum("profit"))}</b></span>` : "");
    el.classList.remove("hidden");
  }
  function card(o) {
    const now = Date.now();
    const s = o.start ? new Date(o.start) : null;
    const e = o.end ? new Date(o.end) : null;
    const isNow = s && e && s.getTime() <= now && now < e.getTime() && o.status !== "cancel";
    const st = STATUS[o.status] || null;
    const title = esc(o.service || "Заказ") + (o.area ? ` <em>· ${esc(String(o.area).replace(".", ","))} м²</em>` : "");
    const addr = [o.address, o.entrance ? `подъезд ${o.entrance}` : ""].filter(Boolean).join(", ");
    const mapQ = encodeURIComponent([o.city, o.address].filter(Boolean).join(", "));
    const rows = [];

    const moneyHtml = m ? `<div class="money">
        ${cell(m.corrected ? "Оплатил" : "Клиенту", m.client, "main", m.discount || "")}

    return `<article class="card${isNow ? " now" : ""}${o.status === "cancel" ? " cancel" : ""}">
      <div class="time">
        ${o.allDay ? "<b>Весь</b><span>день</span>" : `<b>${s ? localTime(s, o.city) : "—"}</b><span>${e ? "до " + localTime(e, o.city) : ""}</span>${CITY_TZ[o.city] ? '<span class="loc">местное</span>' : ""}`}
        <div class="bar-v"></div>
      </div>
      <div class="body">
        <div class="tags">
          ${o.city ? `<span class="tag city">${esc(o.city)}</span>` : ""}
          ${isNow ? '<span class="tag st-now">Идёт сейчас</span>' : st ? `<span class="tag ${st[1]}">${st[0]}</span>` : ""}
        </div>
        <h3 class="svc">${title}</h3>
        ${showTitle ? `<div class="ctitle">${esc(o.title)}</div>` : ""}
        ${rows.length ? `<div class="rows">${rows.join("")}</div>` : ""}
        ${items.length ? `<div class="items${o.money ? " priced" : ""}">${items.map((i) => `<span>${esc(i).replace(/(\d) (?=\d)/g, "$1&nbsp;").replace(/ ₽/g, "&nbsp;₽")}</span>`).join("")}</div>` : ""}
        ${o.notes ? `<div class="notes">${esc(o.notes)}</div>` : ""}
        ${moneyHtml}
      </div>
    </article>`;
  }
  function daySection(k, arr) {
    const t = dayTitle(k);
    const active = countActive(arr);
    const daySum = arr.filter((o) => o.status !== "cancel" && o.money && o.money.client != null).reduce((a, o) => a + o.money.client, 0);
    return `<section class="day"><div class="day-h"><h2 class="${t.today ? "today" : ""}">${esc(t.main)}</h2><span>${esc(t.sub)}${t.sub ? " · " : ""}${active} ${plural(active, "заказ", "заказа", "заказов")}</span>${daySum ? `<span class="sum">${money(daySum)}</span>` : ""}</div>${arr.map(card).join("")}</section>`;
  }
  function groupByDay(list) {
    const groups = new Map();
    for (const o of list) {
      const k = keyOf(o) || "—";
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(o);
    }
    return [...groups].map(([k, arr]) => daySection(k, arr)).join("");
  }
  const EMPTY = {
    today: "На сегодня заказов нет", tomorrow: "На завтра заказов нет", after: "На послезавтра заказов нет",
    week: "На ближайшие 7 дней заказов нет", month: "В этом месяце заказов нет", all: "Заказов пока нет",
  };
  function render() {
    renderPeriods();
    const list = orders.filter((o) => inPeriod(o, period));
    renderSummary(list);
    if (!list.length) {
      $("list").innerHTML = `<div class="empty"><b>${EMPTY[period]}</b>Как только заказ появится в календаре, он будет здесь.</div>`;
      return;
    }
    if (period === "all" || period === "month") {
      // сначала сегодня и дальше, потом прошедшие — от свежих к старым
      const today = dayAt(0);
      const ahead = list.filter((o) => keyOf(o) >= today);
      const past = list.filter((o) => keyOf(o) < today).reverse();
      $("list").innerHTML = groupByDay(ahead) + (past.length ? `<div class="divider">Прошедшие</div>${groupByDay(past)}` : "");
    } else {
      $("list").innerHTML = groupByDay(list);
    }
  }
  const plural = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? b : c);

  // ---------- управление ----------
  $("periods").addEventListener("click", (e) => {
    const p = e.target.closest("button")?.dataset.p;
    if (!p) return;
    period = p; store.set("vershina-staff-period", p);
    render(); scrollTo({ top: 0 });
  });
  $("refresh").addEventListener("click", () => refresh(true));
  $("logout").addEventListener("click", () => logout());
  document.addEventListener("visibilitychange", () => { if (!document.hidden && savedPin) refresh(); });
  window.addEventListener("online", () => refresh());

  function showApp() {
    $("pinView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    clearInterval(timer);
    timer = setInterval(() => { if (!document.hidden) refresh(); else paintLive(); }, POLL_MS);
    if (!tick) tick = setInterval(() => { paintLive(); if (orders.length) { render(); renderCal(); } }, 60000); // «идёт сейчас» и «сегодня» без запроса
  }
  function logout(msg) {
    if (calOpen) closeCal();
    savedPin = null; store.del(KEY); clearInterval(timer); orders = []; pin = "";
    $("appView").classList.add("hidden"); $("pinView").classList.remove("hidden");
    $("list").innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    paintDots(); $("pinMsg").textContent = msg || "";
  }

  // ---------- полный календарь ----------
  const GCOLOR = { 1: "#7986cb", 2: "#33b679", 3: "#8e24aa", 4: "#e67c73", 5: "#f6bf26", 6: "#f4511e", 7: "#039be5", 8: "#616161", 9: "#3f51b5", 10: "#0b8043", 11: "#d50000" };
  const STATUS_COLOR = { done: "2", cancel: "11", plan: "7", open: "5", partial: "6", moved: "1" };
  const evColor = (o) => GCOLOR[o.color] || GCOLOR[STATUS_COLOR[o.status]] || GCOLOR[7];
  const isDark = (o) => (o.color || STATUS_COLOR[o.status]) === "5";
  const MSK = 3 * 3600000; // Москва без перехода на летнее время
  const mskKey = (ms) => new Date(ms + MSK).toISOString().slice(0, 10);
  const mskMin = (ms) => { const d = new Date(ms + MSK); return d.getUTCHours() * 60 + d.getUTCMinutes(); };
  const addDays = (key, n) => { const d = new Date(key + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const wday = (key) => (new Date(key + "T00:00:00Z").getUTCDay() + 6) % 7; // пн = 0
  const fWd = new Intl.DateTimeFormat("ru-RU", { weekday: "short", timeZone: "UTC" });
  const fMonth = new Intl.DateTimeFormat("ru-RU", { month: "long", timeZone: "UTC" });
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const HH = 52; // высота часа, px
  const WD = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"];

  let calOpen = false;
  let calMode = store.get("vershina-staff-calview") || "3day";
  let calDate = mskKey(Date.now());
  let calScrolled = false;

  function calDays() {
    if (calMode === "day") return [calDate];
    if (calMode === "3day") return [0, 1, 2].map((i) => addDays(calDate, i));
    const mon = addDays(calDate, -wday(calDate));
    return [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(mon, i));
  }
  function calTitle(days) {
    const y = calDate.slice(0, 4), yNow = mskKey(Date.now()).slice(0, 4);
    const m1 = cap(fMonth.format(new Date((calMode === "month" ? calDate : days[0]) + "T00:00:00Z")));
    const last = days[days.length - 1];
    let t = m1;
    if (calMode !== "month" && last.slice(5, 7) !== days[0].slice(5, 7)) t = m1.slice(0, 3) + " – " + cap(fMonth.format(new Date(last + "T00:00:00Z"))).slice(0, 3);
    return y !== yNow ? `${t} ${y}` : t;
  }
  const ordersOn = (key) => orders.filter((o) => o.start && mskKey(new Date(o.start).getTime()) === key);

  /** Раскладка пересекающихся событий по колонкам, как в Google. */
  function layout(list) {
    const items = list.filter((o) => !o.allDay).map((o) => {
      const s = new Date(o.start).getTime();
      const e = o.end ? new Date(o.end).getTime() : s + 3600000;
      const sm = mskMin(s);
      let em = mskKey(e) !== mskKey(s) ? 1440 : mskMin(e);
      if (em <= sm) em = Math.min(1440, sm + 30);
      return { o, sm, em };
    }).sort((a, b) => a.sm - b.sm || b.em - a.em);
    const out = [];
    let cluster = [], end = -1;
    const flush = () => {
      const cols = [];
      for (const it of cluster) {
        let c = cols.findIndex((last) => last <= it.sm);
        if (c < 0) { c = cols.length; cols.push(0); }
        cols[c] = it.em; it.col = c;
      }
      for (const it of cluster) { it.cols = cols.length; out.push(it); }
      cluster = [];
    };
    for (const it of items) {
      if (cluster.length && it.sm >= end) { flush(); end = -1; }
      cluster.push(it); end = Math.max(end, it.em);
    }
    if (cluster.length) flush();
    return out;
  }
  function evBlock(it) {
    const o = it.o;
    const h = Math.max(((it.em - it.sm) / 60) * HH - 2, 20);
    const w = 100 / it.cols;
    const t = `${fmtTime(new Date(o.start))}${o.end ? "–" + fmtTime(new Date(o.end)) : ""}`;
    const sub = [o.city, o.address].filter(Boolean).join(", ");
    return `<div class="cal-ev${o.status === "cancel" ? " cancel" : ""}${isDark(o) ? " dark" : ""}" data-id="${esc(o.id)}"
      style="top:${(it.sm / 60) * HH + 1}px;height:${h}px;left:calc(${w * it.col}% + 1px);width:calc(${w}% - 3px);background:${evColor(o)}">
      <b>${esc(o.service || "Заказ")}${o.area ? " · " + esc(String(o.area)) + " м²" : ""}</b>
      ${h > 34 ? `<i>${t}</i>` : ""}${h > 50 && sub ? `<i>${esc(sub)}</i>` : ""}</div>`;
  }
  function chip(o) {
    return `<span class="cal-chip${o.status === "cancel" ? " cancel" : ""}${isDark(o) ? " dark" : ""}" data-id="${esc(o.id)}" style="background:${evColor(o)}">${esc(o.city || o.service || "Заказ")}</span>`;
  }
  function renderTimeGrid(days) {
    const today = mskKey(Date.now());
    const cols = `46px repeat(${days.length}, minmax(0, 1fr))`;
    const heads = `<div class="cal-heads" style="grid-template-columns:${cols}"><div></div>${days.map((k) =>
      `<div class="cal-head${k === today ? " today" : ""}" data-day="${k}"><span>${WD[wday(k)]}</span><b>${Number(k.slice(8))}</b></div>`).join("")}</div>`;
    const allDay = days.map((k) => ordersOn(k).filter((o) => o.allDay));
    const allDayRow = allDay.some((a) => a.length) ? `<div class="cal-allday" style="grid-template-columns:${cols}"><div></div>${allDay.map((a) => `<div class="cal-cell">${a.map(chip).join("")}</div>`).join("")}</div>` : "";
    let hours = "";
    for (let h = 1; h < 24; h++) hours += `<span style="top:${h * HH}px">${String(h).padStart(2, "0")}:00</span>`;
    const nowMin = mskMin(Date.now());
    const colsHtml = days.map((k) => `<div class="cal-col" data-day="${k}">${layout(ordersOn(k)).map(evBlock).join("")}${k === today ? `<div class="cal-now" style="top:${(nowMin / 60) * HH}px"></div>` : ""}</div>`).join("");
    const prevScroll = $("calScroll")?.scrollTop;
    $("calBody").innerHTML = `${heads}${allDayRow}<div class="cal-scroll" id="calScroll"><div class="cal-grid" style="grid-template-columns:${cols};height:${24 * HH}px;--hh:${HH}px"><div class="cal-hours">${hours}</div>${colsHtml}</div></div>`;
    const sc = $("calScroll");
    if (!calScrolled) {
      const hasToday = days.includes(today);
      sc.scrollTop = Math.max(0, ((hasToday ? nowMin / 60 - 1.5 : 7)) * HH);
      calScrolled = true;
    } else if (prevScroll != null) sc.scrollTop = prevScroll;
  }
  function renderMonth() {
    const today = mskKey(Date.now());
    const first = calDate.slice(0, 8) + "01";
    const start = addDays(first, -wday(first));
    const nextMonth = addDays(first, 32).slice(0, 8) + "01";
    const weeks = Math.ceil((wday(first) + (new Date(nextMonth + "T00:00:00Z") - new Date(first + "T00:00:00Z")) / 86400000) / 7);
    let cells = "";
    for (let i = 0; i < weeks * 7; i++) {
      const k = addDays(start, i);
      const list = ordersOn(k).sort((a, b) => (a.start || "").localeCompare(b.start || ""));
      const max = weeks > 5 ? 2 : 3;
      cells += `<div class="cal-day${k.slice(0, 7) !== first.slice(0, 7) ? " other" : ""}${k === today ? " today" : ""}" data-day="${k}">
        <span class="n">${Number(k.slice(8))}</span>${list.slice(0, max).map(chip).join("")}${list.length > max ? `<span class="more">ещё ${list.length - max}</span>` : ""}</div>`;
    }
    $("calBody").innerHTML = `<div class="cal-mhead">${WD.map((d) => `<span>${d}</span>`).join("")}</div><div class="cal-month" style="grid-template-rows:repeat(${weeks},1fr)">${cells}</div>`;
  }
  function renderCal() {
    if (!calOpen) return;
    [...$("calViews").children].forEach((b) => b.classList.toggle("on", b.dataset.v === calMode));
    $("calTodayNum").textContent = Number(mskKey(Date.now()).slice(8));
    const days = calDays();
    $("calTitle").textContent = calTitle(days);
    if (calMode === "month") renderMonth(); else renderTimeGrid(days);
  }
  function calShift(dir) {
    if (calMode === "month") { const d = new Date(calDate.slice(0, 8) + "01T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() + dir); calDate = d.toISOString().slice(0, 10); }
    else calDate = addDays(calDate, dir * (calMode === "day" ? 1 : calMode === "3day" ? 3 : 7));
    renderCal();
  }
  function openCal(push = true) {
    calOpen = true; calScrolled = false; calDate = mskKey(Date.now());
    $("calView").classList.remove("hidden");
    document.body.style.overflow = "hidden";
    if (push) try { history.pushState({ cal: 1 }, "", "#calendar"); } catch {}
    renderCal();
  }
  function closeCal(fromPop = false) {
    calOpen = false; closeSheet();
    $("calView").classList.add("hidden");
    document.body.style.overflow = "";
    if (!fromPop && location.hash === "#calendar") try { history.back(); } catch {}
  }
  function openSheet(id) {
    const o = orders.find((x) => x.id === id);
    if (!o) return;
    $("sheetRoot").innerHTML = `<div class="sheet-bg" id="sheetBg"></div><div class="sheet" role="dialog"><div class="grab"></div>${card(o)}<button class="sheet-close" id="sheetClose">Закрыть</button></div>`;
    $("sheetBg").onclick = closeSheet; $("sheetClose").onclick = closeSheet;
  }
  function closeSheet() { $("sheetRoot").innerHTML = ""; }

  $("openCal").addEventListener("click", () => openCal());
  $("calBack").addEventListener("click", () => closeCal());
  $("calPrev").addEventListener("click", () => calShift(-1));
  $("calNext").addEventListener("click", () => calShift(1));
  $("calToday").addEventListener("click", () => { calDate = mskKey(Date.now()); calScrolled = false; renderCal(); });
  $("calViews").addEventListener("click", (e) => {
    const v = e.target.closest("button")?.dataset.v;
    if (!v) return;
    calMode = v; store.set("vershina-staff-calview", v); calScrolled = false; renderCal();
  });
  $("calBody").addEventListener("click", (e) => {
    const ev = e.target.closest("[data-id]");
    if (ev) { e.stopPropagation(); openSheet(ev.dataset.id); return; }
    const head = e.target.closest(".cal-head, .cal-day");
    if (head) { calDate = head.dataset.day; calMode = "day"; store.set("vershina-staff-calview", "day"); calScrolled = false; renderCal(); }
  });
  // свайп влево/вправо — как в Google Календаре
  let tx = null, ty = null;
  $("calBody").addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  $("calBody").addEventListener("touchend", (e) => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    tx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) calShift(dx < 0 ? 1 : -1);
  }, { passive: true });
  window.addEventListener("popstate", () => { if (calOpen && location.hash !== "#calendar") closeCal(true); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if ($("sheetRoot").innerHTML) closeSheet(); else if (calOpen) closeCal(); } });

  if (savedPin) { showApp(); refresh(); if (location.hash === "#calendar") openCal(false); }
})();
</script>
</body>
</html>
